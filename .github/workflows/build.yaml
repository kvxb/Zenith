name: Cross-Platform Flet Build

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-executables:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # Build targets: Linux and Windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install Flet and Pillow, but crucially, also PyInstaller!
          pip install flet Pillow pyinstaller -r requirements.txt
        shell: bash

      ---

      - name: Run PyInstaller Build
        # This single command works for both OSes because all paths and arguments
        # are handled correctly inside the main.spec file.
        run: pyinstaller main.spec 
        shell: bash

      ---
      
      # --- Artifact Upload ---
      - name: Rename and Prepare Executable
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            # The output executable is dist/main.exe on Windows
            mv dist/main.exe Zenith-Windows.exe
          else
            # The output executable is dist/main on Linux/Ubuntu
            mv dist/main Zenith-Ubuntu
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-${{ matrix.os }}
          # Path must match the renamed file in the current working directory
          path: |
            Zenith-Windows.exe
            Zenith-Ubuntu