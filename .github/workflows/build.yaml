name: Cross-Platform Flet Build

on:
  push:
    branches:
      - build
      - main
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-executables:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # Build targets: Linux and Windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            libgtk-3-dev \
            ninja-build \
            clang \
            cmake

      - name: Setup Flutter (Linux)
        if: runner.os == 'Linux'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Flutter (Windows)
        if: runner.os == 'Windows'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 flet-audio==0.1.0 spotipy yt-dlp mutagen
        working-directory: ${{ github.workspace }}

      - name: Build with Flet (Linux)
        run: |
          flet build linux --skip-flutter-doctor
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}

      - name: Build with Flet (Windows)
        run: |
          flet build windows --skip-flutter-doctor
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1

      - name: Upload Linux Artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Linux-x64
          path: build/linux/

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Windows-x64
          path: build/windows/