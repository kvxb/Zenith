name: Build and Package Flet App (.deb)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs: # <--- MUST be at the top level
  build_deb: # <--- MUST be indented by 2 spaces relative to 'jobs'
    runs-on: ubuntu-latest
    env: # <--- Indented by 4 spaces
      # --- Define Variables Here ---
      APP_NAME: zenith
      APP_DIR: debian_package
      APP_SHARE_PATH: debian_package/usr/share/zenith
      APP_BIN_PATH: /usr/bin/zenith

    steps: # <--- Indented by 4 spaces
      - name: ⬇️ Checkout Repository # <--- Indented by 6 spaces
        uses: actions/checkout@v4

      # --- Setup & Dependencies ---
      - name: 🐍 Set up Python and Install Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt flet

      - name: 🛠️ Install Build Tools and Runtime Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            mpv libmpv2 ffmpeg \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pulseaudio

      # --- Build Flet Application ---
      - name: 🏗️ Build Flet Linux Runner
        run: flet build linux

      # --- Package Creation Section ---
      - name: 📂 Prepare .deb Staging Directory
        run: |
          # 3. Clean and Copy Flet Runtime
          rm -rf $APP_SHARE_PATH/*
          cp -r build/linux/. $APP_SHARE_PATH/

      - name: 📝 Create Control, Desktop, and Maintainer Scripts
        run: |
          VERSION="${{ github.ref_name }}"
          INSTALLED_SIZE=$(du -ks $APP_DIR/usr | awk '{print $1}')
          APP_SHARE_PATH_FHS="/usr/share/$APP_NAME"

          # --- 1. Control File (Dynamically Generated) ---
          cat <<EOF > $APP_DIR/DEBIAN/control
          Package: $APP_NAME
          Version: $VERSION
          Section: multimedia
          Priority: optional
          Architecture: amd64
          Maintainer: Your Name <you@example.com>
          Installed-Size: $INSTALLED_SIZE
          Depends: ffmpeg, mpv, libmpv2, libgtk-3-0, libgstreamer1.0-0, libgstreamer-plugins-base1.0-0, gstreamer1.0-plugins-good, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, gstreamer1.0-pulseaudio
          Description: Zenith Music Player - Built with Flet.
           A portable music player using the powerful Flet framework.
          EOF

          # --- 2. Desktop File (Dynamically Generated) ---
          cat <<EOF > $APP_DIR/usr/share/applications/${APP_NAME}.desktop
          [Desktop Entry]
          Name=Zenith Music Player
          Comment=A modern music player built with Flet
          Exec=$APP_BIN_PATH
          Terminal=false
          Type=Application
          Icon=$APP_NAME
          Categories=AudioVideo;Player;
          EOF

          # --- 3. Launch Wrapper Script (CWD Fix) ---
          cat <<EOF > $APP_DIR$APP_BIN_PATH
          #!/bin/bash
          APP_ROOT="$APP_SHARE_PATH_FHS"
          cd "$APP_ROOT"
          exec ./$APP_NAME "$$@"
          EOF
          chmod 755 $APP_DIR$APP_BIN_PATH

          # --- 4. Post-Installation Script ---
          cat <<EOF > $APP_DIR/DEBIAN/postinst
          #!/bin/sh
          update-desktop-database /usr/share/applications/
          gtk-update-icon-cache -f /usr/share/icons/hicolor || true
          EOF
          chmod 755 $APP_DIR/DEBIAN/postinst

      - name: 📦 Build Final .deb Package and Upload
        run: |
          dpkg-deb --build $APP_DIR
          mv ${APP_DIR}.deb ${APP_NAME}_${{ github.ref_name }}_amd64.deb

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-linux-deb
          path: ./*.deb
