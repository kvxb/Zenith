name: Build and Package Flet App (.deb)

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

jobs:
  build_deb:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python and Install Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt flet

      - name: 🛠️ Install Build Tools and Runtime Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            mpv libmpv2 ffmpeg \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-pulseaudio

      - name: Configure
        run: |
          APP_BIN_PATH=$(python3 setup_deb.py target-path | tr -d '\n')
          python3 setup_deb.py flet-config ${{ github.ref_name }}
          flet build linux -o $APP_BIN_PATH

          python3 setup_deb.py deb-config ${{ github.ref_name }}
      - name: Package .deb
        run: |
          APP_BIN_PATH=$(python3 setup_deb.py target-path | tr -d '\n')
          PACKAGE_FILE_NAME=$(python3 setup_deb.py package-file-name ${{ github.ref_name }} | tr -d '\n')
          PACKAGE_DIR=$(python3 setup_deb.py package-dir | tr -d '\n')
          APP_NAME=$(python3 setup_deb.py app-name | tr -d '\n

          dpkg-deb --build $PACKAGE_DIR
          mv ${PACKAGE_DIR}.deb ${APP_NAME}_${{ github.ref_name }}_amd64.deb

      - name: 🧪 Install and Smoke Test .deb
        run: |
          APP_NAME=$(python3 setup_deb.py app-name | tr -d '\n')
          sudo apt-get update
          sudo apt-get install -y ./${APP_NAME}_${{ github.ref_name }}_amd64.deb || (cat /var/lib/dpkg/status && exit 1)
          timeout 20s zenith || true

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-linux-deb
          path: ./*.deb
